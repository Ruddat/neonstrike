<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Neon Strike</title>
    <link rel="stylesheet" href="css/game.css">
</head>
<body>
    <main class="game-shell">
        <canvas id="game" width="1280" height="720"></canvas>

        <div class="overlay" id="overlay">
            <section class="menu-card">
                <p class="eyebrow">HTML5 Canvas Shooter</p>
                <h1>Neon Strike</h1>
                <p class="subtitle">
                    Katakis-Style Retro-Shooter: Waffen-Upgrades, Combo-System, Formationen, Boss-Fights.
                </p>
                <button id="startButton" type="button">Start Game</button>
                <p class="hint">
                    WASD / Pfeiltasten bewegen · Space schießen · K Bombe · P Pause · F Fullscreen · Combo = Bomb-Fragmente!
                </p>
            </section>
        </div>

        <button id="fullscreenBtn" class="fs-btn" type="button" title="Fullscreen (F)">&#x26F6;</button>

        <div class="hud-note">Canvas · Browsergame · keine Installation</div>
    </main>

    <script type="module" src="js/main.js"></script>
</body>
</html>
